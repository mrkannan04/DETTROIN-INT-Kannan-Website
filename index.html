<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/school-logo.png" />
    <link rel="apple-touch-icon" href="/school-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krishna International School | Aligarh (CBSE Affiliated)</title>
    <meta name="description" content="Krishna International School, Aligarh - Dedicated to Excellence. Premier CBSE affiliated school set amidst 5 acres of eco-friendly campus." />
    <!-- Preload critical brand & hero assets to prevent blank image loading flash -->
    <link rel="preload" as="image" href="/school-logo.png" />
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1546410531-bb4caa6b424d?q=80&w=1600&auto=format&fit=crop" />
    <!-- Google Fonts: Playfair Display for prestige serif headings, Inter & Lexend for clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Inline script to prevent Flash of Unthemed Content (FOUC) -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('kis-theme');
          if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
          var savedFontSize = localStorage.getItem('kis-font-size');
          if (savedFontSize === 'large') {
            document.documentElement.style.fontSize = '18px';
          } else if (savedFontSize === 'xlarge') {
            document.documentElement.style.fontSize = '20px';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-primary text-body font-sans antialiased overflow-x-hidden transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
